spring:
  datasource:
    url: jdbc:tc:postgresql:16.4-alpine:///db
    hikari:
      schema: public

opentmf:

  catalog-sync:
    enabled: false
    catalog-version: 1.0.0
    product-catalog-url: localhost
    resource-catalog-url: localhost
    service-catalog-url: localhost
    client-ref: default

  db-lock:
    lock-acquire-poll-interval: 100
    lock-acquire-timeout: 1000
    lock-hold-timeout: 60000

  http-clients:
    default:
      client-type: netty
      num-retries: 3
      retry-wait-millis: 100
      basic-auth:
        username: user
        password: pass
